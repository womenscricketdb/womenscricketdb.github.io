    <style>
        .wca-standings-selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.75rem;
            font-family: var(--wca-font-body);
        }
        .wca-standings-selectors .wca-filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .wca-standings-selectors .form-label {
            font-size: 0.8rem;
            color: var(--wca-text-dim);
            margin-bottom: 0;
        }
        .wca-standings-selectors select {
            background: var(--wca-surface);
            border: 1px solid var(--wca-border);
            color: var(--wca-text);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-family: var(--wca-font-body);
            font-size: 0.9rem;
            min-width: 160px;
        }
        .wca-tournament-heading {
            font-family: var(--wca-font-body);
            color: var(--wca-text-dim);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }
        .wca-pool-heading {
            font-family: var(--wca-font-display);
            font-weight: 700;
            color: var(--wca-gold);
            font-size: 1rem;
            margin: 1.5rem 0 0.5rem;
        }
        .wca-pool-heading:first-of-type { margin-top: 0; }
    </style>
</head>
<body>

<div id="wca-header-root"></div>

<main class="container py-4">
    <div class="wca-breadcrumb"><a href="index.html">Home</a> / Seasons</div>
    <h1 class="wca-section-title">Seasons</h1>
    <p class="text-secondary" style="font-family: var(--wca-font-body); font-size:0.9rem;">
        League tables season by season. Pick a season, format and division below.
    </p>

    <div class="wca-standings-selectors">
        <div class="wca-filter-group">
            <label class="form-label fw-bold" for="seasonSelect">Season</label>
            <select id="seasonSelect" aria-label="Season"></select>
        </div>
        <div class="wca-filter-group">
            <label class="form-label fw-bold" for="formatSelect">Format</label>
            <select id="formatSelect" aria-label="Format"></select>
        </div>
        <div class="wca-filter-group">
            <label class="form-label fw-bold" for="divisionSelect">Division</label>
            <select id="divisionSelect" aria-label="Division"></select>
        </div>
    </div>

    <p class="text-secondary" style="font-family: var(--wca-font-body); font-size:0.85rem;">
        <i class="bi bi-info-circle-fill text-warning me-1" data-bs-toggle="tooltip" data-bs-placement="top"
           title="Position reflects final on-field outcomes, including any playoffs, not just the round-robin points table, so it can differ from a simple points/NRR ranking."></i>
        Position accounts for playoffs, not just points.
    </p>

    <div id="standingsRoot">
        <div class="wca-loading"><div class="wca-spinner"></div> Loading standings…</div>
    </div>

    <h2 class="wca-section-title" style="font-size:1.3rem; margin-top:2rem;">Matches</h2>
    <div id="matchesRoot">
        <div class="wca-loading"><div class="wca-spinner"></div> Loading matches…</div>
    </div>
</main>

<div id="wca-footer-root"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/table-render.js"></script>
<script>
    WCA_NAV.render("seasons");
    WCA_NAV.renderFooter();

    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

    let allStandings = [];
    let allMatches = [];

    // A row displayed on this page always has a fixed Season/Format/Division
    // (chosen via the selectors above), so those columns are dropped rather
    // than shown per-row, only what varies within the table survives.
    function toDisplayRow(r) {
        return {
            Position: r.Position,
            Team: r.Team,
            Result: WCA.finishTypeLabel(r.Finish_Type),
            M: r.Matches_Played,
            W: r.Wins,
            L: r.Losses,
            T: r.Ties,
            NR: r.No_Results,
            Pts: r.Points,
            NRR: r.Net_Run_Rate,
        };
    }

    function setUrl(season, format, division) {
        const p = new URLSearchParams();
        p.set("season", season);
        p.set("format", format);
        p.set("division", division);
        history.replaceState(null, "", `seasons.html?${p.toString()}`);
    }

    function matchToDisplayRow(m) {
        return {
            Date: m.date,
            Team_Home: m.team_home,
            Team_Away: m.team_away,
            // m.outcome carries the match-level status ("No Result",
            // "Abandoned") for matches with no winner - not yet present in
            // MatchIndex.json as of this fix, pending a consolidate.py
            // change (see handover); harmless no-op fallback to "Result
            // not recorded" until then.
            Result: WCA.resultLabel(m.winner, m.win_margin, m.win_margin_type, m.outcome),
        };
    }

    // "Division 1"/"Division 2" (the selector's values, matching Standings.json's
    // Division field) vs "Div 1"/"Div 2"/"Cross-Div" (Match_Division's actual
    // export values) - two different string formats for the same idea. This
    // maps between them, and treats Cross-Div matches as belonging to BOTH
    // division filters rather than neither, since a cross-division match is
    // relevant to fans of either side's own division.
    function matchBelongsToDivision(matchDivision, selectedDivision) {
        if (matchDivision === "Cross-Div") return true;
        const short = selectedDivision === "Division 1" ? "Div 1" : "Div 2";
        return matchDivision === short;
    }

    function renderMatches() {
        const season = document.getElementById("seasonSelect").value;
        const format = document.getElementById("formatSelect").value;
        const divisionSelect = document.getElementById("divisionSelect");
        const hasDivisions = divisionSelect.options.length > 0;
        const division = divisionSelect.value;

        const root = document.getElementById("matchesRoot");
        const rows = allMatches.filter(m =>
            m.season === season && m.format === format &&
            // No Division control at all this season/format (see
            // updateDivisionOptions) means there's no real division
            // structure to filter by - every match for the season/format
            // shows, rather than being silently narrowed by whatever
            // Match_Division's raw value happens to be.
            (!hasDivisions || matchBelongsToDivision(m.division, division))
        );

        if (!rows.length) {
            root.innerHTML = `<div class="wca-empty-state">No matches recorded for this selection.</div>`;
            return;
        }

        const sorted = [...rows].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        root.innerHTML = "";
        const tableRoot = document.createElement("div");
        root.appendChild(tableRoot);

        WCA_TABLE.render(tableRoot, sorted.map(matchToDisplayRow), {
            compact: true, noFilters: true, defaultSort: { col: "Date", dir: "asc" },
        });

        // Date cell -> match.html, using the row's own slug rather than the
        // generic (Date, Opposition) lookup used on record tables - here we
        // already know the exact match, no ambiguity to resolve.
        tableRoot.querySelectorAll("tbody tr").forEach((tr, i) => {
            const cell = tr.querySelector("td:first-child");
            if (cell && sorted[i]) cell.innerHTML = `<a class="wca-entity-link" href="${WCA.matchUrl(sorted[i].slug)}">${WCA.escapeHtml(sorted[i].date)}</a>`;
        });
    }

    function render() {
        const season = document.getElementById("seasonSelect").value;
        const format = document.getElementById("formatSelect").value;
        const divisionSelect = document.getElementById("divisionSelect");
        const hasDivisions = divisionSelect.options.length > 0;
        const division = divisionSelect.value;
        setUrl(season, format, division);

        const root = document.getElementById("standingsRoot");

        if (!hasDivisions) {
            // Genuinely no standings for this season/format at all (e.g.
            // 20/21's bio-bubbles) - a dedicated message rather than the
            // generic per-division one below, which would otherwise read
            // oddly with an empty division name ("... for List A  in the
            // 20/21 season").
            root.innerHTML = `<div class="wca-empty-state">No standings recorded for ${WCA.escapeHtml(format)} in the ${WCA.escapeHtml(season)} season - matches were played without a divisional/league table structure.</div>`;
            return;
        }

        const rows = allStandings.filter(r => r.Season === season && r.Format === format && r.Division === division);

        if (!rows.length) {
            root.innerHTML = `<div class="wca-empty-state">No standings recorded for ${WCA.escapeHtml(format)} ${WCA.escapeHtml(division)} in the ${WCA.escapeHtml(season)} season.</div>`;
            return;
        }

        root.innerHTML = `<p class="wca-tournament-heading">${WCA.escapeHtml(rows[0].Tournament)}</p><div id="standingsTables"></div>`;
        const tablesRoot = document.getElementById("standingsTables");

        const pools = Array.from(new Set(rows.map(r => r.Pool))).sort();
        const hasPools = pools.length > 1 || (pools.length === 1 && pools[0] !== "");

        if (!hasPools) {
            const sorted = [...rows].sort((a, b) => (a.Position ?? 999) - (b.Position ?? 999));
            const tableRoot = document.createElement("div");
            tablesRoot.appendChild(tableRoot);
            WCA_TABLE.render(tableRoot, sorted.map(toDisplayRow), { compact: true, noFilters: true, defaultSort: { col: "Position", dir: "asc" } });
            return;
        }

        pools.forEach(pool => {
            const heading = document.createElement("div");
            heading.className = "wca-pool-heading";
            heading.textContent = pool || "Ungrouped";
            tablesRoot.appendChild(heading);

            const sorted = rows.filter(r => r.Pool === pool).sort((a, b) => (a.Position ?? 999) - (b.Position ?? 999));
            const tableRoot = document.createElement("div");
            tablesRoot.appendChild(tableRoot);
            WCA_TABLE.render(tableRoot, sorted.map(toDisplayRow), { compact: true, noFilters: true, defaultSort: { col: "Position", dir: "asc" } });
        });
    }

    // Format/Division options prefer standings (the richer, more complete
    // source when it exists), but fall back to whatever the match data
    // itself has for a season with no standings at all - e.g. the 20/21
    // pandemic season (four bio-bubbles, no divisional structure, no
    // points tables kept) still had real matches played, and those should
    // still be browsable even though there's nothing to show in the
    // standings table above them.
    function validFormatsFor(season) {
        const fromStandings = Array.from(new Set(allStandings.filter(r => r.Season === season).map(r => r.Format))).sort();
        if (fromStandings.length) return fromStandings;
        return Array.from(new Set(allMatches.filter(m => m.season === season).map(m => m.format))).sort();
    }
    function validDivisionsFor(season, format) {
        // Standings-only, deliberately no match-data fallback here - unlike
        // Format (a real property every match has), "Division 1"/"Division 2"
        // is a competition-structure concept that only exists where a real
        // league/points-table structure existed. Match_Division's own raw
        // values ("Div 1"/"Div 2"/"Cross-Div") are a different vocabulary
        // already used for the matches-list filter below, not something to
        // surface here as if it were a genuine standings division - a
        // season with no standings gets no Division options at all rather
        // than a fabricated one.
        return Array.from(new Set(allStandings.filter(r => r.Season === season && r.Format === format).map(r => r.Division))).sort();
    }
    function updateFormatOptions(season, preferredValue) {
        const formatSelect = document.getElementById("formatSelect");
        const options = validFormatsFor(season);
        if (!options.length) return; // genuinely nothing for this season in either source - leave prior dropdown rather than show an empty one
        formatSelect.innerHTML = options.map(f => `<option value="${WCA.escapeHtml(f)}">${WCA.escapeHtml(f)}</option>`).join("");
        formatSelect.value = (preferredValue && options.includes(preferredValue)) ? preferredValue
            : (options.includes("List A") ? "List A" : options[0]);
    }
    function updateDivisionOptions(season, format, preferredValue) {
        const divisionSelect = document.getElementById("divisionSelect");
        const divisionGroup = divisionSelect.closest(".wca-filter-group");
        const options = validDivisionsFor(season, format);

        if (!options.length) {
            // No standings for this season/format - Division isn't a real
            // choice here (nothing to divide into, e.g. 20/21's bio-bubbles),
            // so the control is hidden entirely rather than offering a
            // Division 1/2 choice that never applied. renderMatches() and
            // render() both check divisionSelect.options.length directly
            // rather than trusting a leftover <select> value.
            divisionSelect.innerHTML = "";
            if (divisionGroup) divisionGroup.style.display = "none";
            return;
        }

        if (divisionGroup) divisionGroup.style.display = "";
        divisionSelect.innerHTML = options.map(d => `<option value="${WCA.escapeHtml(d)}">${WCA.escapeHtml(d)}</option>`).join("");
        divisionSelect.value = (preferredValue && options.includes(preferredValue)) ? preferredValue
            : (options.includes("Division 1") ? "Division 1" : options[0]);
    }

    async function load() {
        allStandings = await WCA.fetchStandings() || [];
        allMatches = await WCA.fetchMatchIndex() || [];

        // Union of both sources - a season with real matches but no
        // standings (20/21) must still be selectable, not silently
        // dropped just because the season list used to be standings-only.
        const seasons = Array.from(new Set([
            ...allStandings.map(r => r.Season),
            ...allMatches.map(m => m.season),
        ])).sort();
        const seasonSelect = document.getElementById("seasonSelect");
        seasonSelect.innerHTML = seasons.map(s => `<option value="${s}">${s}</option>`).join("");

        const params = new URLSearchParams(location.search);
        const defaultSeason = seasons.includes(params.get("season")) ? params.get("season") : seasons[seasons.length - 1];
        seasonSelect.value = defaultSeason;

        updateFormatOptions(defaultSeason, params.get("format"));
        updateDivisionOptions(defaultSeason, document.getElementById("formatSelect").value, params.get("division"));

        const formatSelect = document.getElementById("formatSelect");
        const divisionSelect = document.getElementById("divisionSelect");

        seasonSelect.addEventListener("change", () => {
            updateFormatOptions(seasonSelect.value);
            updateDivisionOptions(seasonSelect.value, formatSelect.value);
            render(); renderMatches();
        });
        formatSelect.addEventListener("change", () => {
            updateDivisionOptions(seasonSelect.value, formatSelect.value);
            render(); renderMatches();
        });
        divisionSelect.addEventListener("change", () => { render(); renderMatches(); });

        render();
        renderMatches();
    }

    load();
</script>
</body>
</html>
