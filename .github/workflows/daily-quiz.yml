name: Generate daily quiz

on:
  schedule:
    # 04:00 UTC = 06:00 SAST, well clear of midnight in South Africa
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's quiz
        run: python3 tools/generate_quiz.py

      - name: Commit if changed
        run: |
          git config user.name "quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quiz/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily quiz: $(date -u +%Y-%m-%d)"
            git push
          fi
