name: Generate daily quiz

on:
  schedule:
    # 00:05 UTC -- as close to UTC midnight as practical without landing
    # exactly on the hour (GitHub's scheduler queues get congested right
    # at :00, so runs can be delayed further there than a few minutes off
    # it). quiz.js's "today" is UTC-anchored (see quiz.js comments), so
    # this window is the same for every visitor worldwide, not just SA --
    # keeping it small matters equally for everyone, not just one region.
    - cron: "5 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's quiz
        run: python3 tools/generate_quiz.py

      - name: Commit if changed
        run: |
          git config user.name "quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quiz/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily quiz: $(date -u +%Y-%m-%d)"
            git push
          fi
