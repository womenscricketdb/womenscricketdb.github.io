name: Generate daily quiz

on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 3 * * *"   # retry a few hours later if the first one got skipped
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate quiz for the next few days
        run: |
          for i in 0 1 2 3; do
            d=$(date -u -d "+$i day" +%Y-%m-%d)
            python3 tools/generate_quiz.py --date "$d"
          done

      - name: Commit if changed
        run: |
          git config user.name "quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quiz/ tools/recent_keys.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily quiz: $(date -u +%Y-%m-%d)"
            git push
          fi
