<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - Women's Provincial Cricket Database</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <link rel="canonical" href="https://womenscricketdb.github.io/teams.html">
    <meta name="description" content="Provincial records, results and information for every South African women's domestic cricket team.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Women's Provincial Cricket Database">
    <meta property="og:title" content="Teams - Women's Provincial Cricket Database">
    <meta property="og:description" content="Provincial records, results and information for every South African women's domestic cricket team.">
    <meta property="og:url" content="https://womenscricketdb.github.io/teams.html">
    <meta property="og:image" content="https://womenscricketdb.github.io/assets/images/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Teams - Women's Provincial Cricket Database">
    <meta name="twitter:description" content="Provincial records, results and information for every South African women's domestic cricket team.">
    <meta name="twitter:image" content="https://womenscricketdb.github.io/assets/images/share-card.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">

    <style>
        .wca-team-map-card {
            background: var(--wca-surface);
            border: 1px solid var(--wca-border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        .wca-team-map-card .hint {
            font-family: var(--wca-font-body);
            font-size: 0.8rem;
            color: var(--wca-text-dim);
            margin-top: 0.5rem;
        }
        /* The map's SVG viewBox is square, so capping width in vh units also
           caps height, keeps it from ever growing taller than the window. */
        #unionMap {
            max-width: min(100%, 65vh);
            margin: 0 auto;
        }
        .wca-team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .wca-team-card {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            background: var(--wca-surface);
            border: 1px solid var(--wca-border);
            border-left: 4px solid var(--wca-gold);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--wca-text);
            text-decoration: none;
            font-family: var(--wca-font-body);
            font-weight: 600;
        }
        .wca-team-card:hover {
            background: var(--wca-surface-raised);
            color: #fff;
            text-decoration: none;
        }
        .wca-team-card .logo {
            height: 22px;
            width: auto;
            flex-shrink: 0;
        }
        .wca-team-card .dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="wca-header-root"></div>

<main class="container py-4">
    <div class="wca-breadcrumb"><a href="index.html">Home</a> / Teams</div>
    <h1 class="wca-section-title">Teams</h1>

    <div class="wca-team-map-card">
        <div id="unionMap"></div>
        <div class="hint">Hover a union for its team name (on touch, tap once to see it, tap again to open), click/tap to open that team's page. Union boundaries are based on municipal borders.</div>
    </div>

    <div class="wca-team-grid" id="teamGrid">
        <div class="wca-loading"><div class="wca-spinner"></div> Loading teams…</div>
    </div>
</main>

<div id="wca-footer-root"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/union-team-mapping.js"></script>
<script src="assets/js/union-map.js"></script>
<script>
    WCA_NAV.render("teams");
    WCA_NAV.renderFooter();

    renderUnionMap("#unionMap", { geojsonUrl: "assets/geo/CricketUnions.geojson" });

    async function loadTeamGrid() {
        const grid = document.getElementById("teamGrid");
        const names = await WCA.fetchNameIndex("teams");
        if (!names.length) {
            grid.innerHTML = `<div class="wca-empty-state">No teams found.</div>`;
            return;
        }
        const sorted = [...names].sort((a, b) => a.localeCompare(b));
        grid.innerHTML = sorted.map(name => {
            const union = TEAM_NAME_TO_UNION[name];
            const color = union && typeof UNION_COLORS !== "undefined" ? (UNION_COLORS[union] || "#888") : "#888";
            return `<a class="wca-team-card" href="${WCA.teamUrl(name)}">
                        <img class="logo" src="assets/images/thumb/${encodeURIComponent(name)}.png" alt="" onerror="this.remove()">
                        <span class="dot" style="background:${color}"></span> ${WCA.escapeHtml(name)}
                    </a>`;
        }).join("");
    }

    loadTeamGrid();
</script>
</body>
</html>
