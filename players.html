            <input type="text" id="playerSearch" class="form-control bg-transparent border-secondary text-light"
                   placeholder="Search by name…" autocomplete="off">
        </div>
        <a href="compare.html" class="wca-compare-link"><i class="bi bi-arrow-left-right"></i> Compare two players</a>
    </div>

    <div class="wca-player-count" id="playerCount"></div>
    <div class="wca-alpha-strip" id="alphaStrip"></div>

    <div id="playerSections">
        <div class="wca-loading"><div class="wca-spinner"></div> Loading players…</div>
    </div>
</main>

<div id="wca-footer-root"></div>

<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script>
    WCA_NAV.render("players");
    WCA_NAV.renderFooter();

    let allNames = [];

    // "A Breedt" (initial-only first token) should sort after full first names
    // within the same starting letter, e.g. "Aisha ..." before "A Breedt".
    function isInitialOnly(name) {
        const firstToken = name.split(/\s+/)[0] || "";
        return /^[A-Za-z]\.?$/.test(firstToken);
    }

    function sortNames(names) {
        return [...names].sort((a, b) => {
            const ia = isInitialOnly(a) ? 1 : 0;
            const ib = isInitialOnly(b) ? 1 : 0;
            if (ia !== ib) return ia - ib;
            return a.localeCompare(b);
        });
    }

    function groupByLetter(names) {
        const groups = {};
        names.forEach(name => {
            const letter = /^[A-Za-z]/.test(name) ? name[0].toUpperCase() : "#";
            (groups[letter] = groups[letter] || []).push(name);
        });
        Object.keys(groups).forEach(letter => { groups[letter] = sortNames(groups[letter]); });
        return groups;
    }

    // Fuzzy match: every whitespace-separated query token must prefix-match a
    // distinct token in the candidate name, so "L Wolvaardt" finds
    // "Laura Wolvaardt" (l -> Laura, wolvaardt -> Wolvaardt). Falls back to a
    // plain substring check for single-token queries typed as a fragment.
    function matchesQuery(name, query) {
        const qTokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        if (!qTokens.length) return true;

        const nameLower = name.toLowerCase();
        if (qTokens.length === 1 && nameLower.includes(qTokens[0])) return true;

        const nameTokens = nameLower.split(/\s+/);
        const used = new Set();
        for (const qt of qTokens) {
            let matched = false;
            for (let i = 0; i < nameTokens.length; i++) {
                if (used.has(i)) continue;
                if (nameTokens[i].startsWith(qt)) { used.add(i); matched = true; break; }
            }
            if (!matched) return false;
        }
        return true;
    }

    function renderSections(names, { showAlphaStrip }) {
        const groups = groupByLetter(names);
        const letters = Object.keys(groups).sort();

        document.getElementById("alphaStrip").innerHTML = showAlphaStrip
            ? letters.map(l => `<a href="#letter-${l}">${l}</a>`).join("")
            : "";

        const root = document.getElementById("playerSections");
        root.innerHTML = letters.map(letter => `
            <h2 class="wca-subtable-title" id="letter-${letter}">${letter}</h2>
            <div class="wca-player-grid">
                ${groups[letter].map(name => `<a href="${WCA.playerUrl(name)}">${WCA.escapeHtml(name)}</a>`).join("")}
            </div>
        `).join("");
    }

    async function load() {
        allNames = await WCA.fetchNameIndex("players");
        allNames.sort((a, b) => a.localeCompare(b));

        document.getElementById("playerCount").textContent = `${allNames.length.toLocaleString()} players`;

        if (!allNames.length) {
            document.getElementById("playerSections").innerHTML = `<div class="wca-empty-state">No players found.</div>`;
            return;
        }

        renderSections(allNames, { showAlphaStrip: true });
    }

    document.getElementById("playerSearch").addEventListener("input", (e) => {
        const q = e.target.value;
        if (!q.trim()) {
            renderSections(allNames, { showAlphaStrip: true });
            document.getElementById("playerCount").textContent = `${allNames.length.toLocaleString()} players`;
            return;
        }
        const matches = allNames.filter(n => matchesQuery(n, q));
        document.getElementById("playerCount").textContent = `${matches.length.toLocaleString()} match${matches.length === 1 ? "" : "es"}`;
        renderSections(matches, { showAlphaStrip: false });
    });

    load();
</script>
</body>
</html>
