    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="assets/css/site.css">

    <style>
        .wca-entity-hero {
            background: linear-gradient(180deg, #0e2c1e 0%, var(--wca-bg) 100%);
            border-bottom: 1px solid var(--wca-border);
            padding: 2rem 0 1.5rem;
        }
        .wca-entity-hero h1 {
            font-weight: 700;
            color: #fff;
            font-size: clamp(1.6rem, 3.5vw, 2.3rem);
            margin-bottom: 0.25rem;
        }
        .wca-tab-nav .nav-link {
            font-family: var(--wca-font-body);
            font-weight: 600;
            color: var(--wca-text-dim);
        }
        .wca-tab-nav .nav-link.active {
            background-color: var(--wca-surface);
            color: var(--wca-gold);
            border-color: var(--wca-border) var(--wca-border) var(--wca-surface);
        }

        .wca-player-heading {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex-wrap: wrap;
        }
        .wca-player-heading h1 { margin-bottom: 0; }

        .wca-team-logos {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .wca-team-logos img {
            height: 35px;
            width: auto;
        }
        .wca-team-logos a {
            display: inline-flex;
            transition: opacity 0.15s;
        }
        .wca-team-logos a:hover {
            opacity: 0.75;
        }

        .wca-record-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .wca-record-badge {
            font-family: var(--wca-font-body);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--wca-text);
            background: var(--wca-surface-raised);
            border-left: 3px solid var(--wca-gold);
            border-radius: 5px;
            padding: 0.4rem 0.75rem;
        }
        .wca-record-badge .value {
            color: var(--wca-gold);
        }
        .wca-record-badges-note {
            font-family: var(--wca-font-body);
            font-size: 0.78rem;
            color: var(--wca-text-dim);
            font-style: italic;
            margin-top: 0.5rem;
        }
        .wca-compare-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: var(--wca-font-body);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--wca-text-dim);
            text-decoration: none;
            border: 1px solid var(--wca-border);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
        }
        .wca-compare-link:hover { color: var(--wca-gold); border-color: var(--wca-gold); text-decoration: none; }
    </style>
</head>
<body>

<div id="wca-header-root"></div>

<section class="wca-entity-hero">
    <div class="container">
        <div class="wca-breadcrumb"><a href="index.html">Home</a> / <a href="players.html">Players</a> / <span id="crumbName">…</span></div>
        <div class="wca-player-heading">
            <h1 id="playerName">Loading player…</h1>
            <div id="playerLogos" class="wca-team-logos"></div>
            <a id="compareLink" href="#" class="wca-compare-link"><i class="bi bi-arrow-left-right"></i> Compare</a>
        </div>
        <div id="playerSummary" class="mt-3"></div>
    </div>
</section>

<main class="container py-4">
    <ul class="nav nav-tabs wca-tab-nav" id="playerTabs" role="tablist"></ul>
    <div class="tab-content pt-3" id="playerTabContent"></div>
</main>

<div id="wca-footer-root"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/table-render.js"></script>
<script>
    WCA_NAV.render("players");
    WCA_NAV.renderFooter();

    const params = new URLSearchParams(location.search);
    const playerName = params.get("name") || "";

    document.getElementById("playerName").textContent = playerName || "Unknown player";
    document.getElementById("crumbName").textContent = playerName || "Unknown";
    document.title = `${playerName || "Player"} - Women's Provincial Cricket Database`;
    document.getElementById("compareLink").href = `compare.html?p1=${encodeURIComponent(playerName)}`;

    // Loaded once in load() below, reused by every Top 5 Innings table
    // (single-innings grain, eligible for the Date -> match link same as
    // records.html's innings-grain record files).
    let matchLookupIndex = null;

    /** Career/Opposition/Venue-style subtable: one table, no format split. */
    function renderPlainSubtable(container, title, rows) {
        if (!rows || !rows.length) return;
        const heading = document.createElement("div");
        heading.className = "wca-subtable-title";
        heading.textContent = title;
        container.appendChild(heading);
        const tableRoot = document.createElement("div");
        container.appendChild(tableRoot);
        WCA_TABLE.render(tableRoot, rows, { compact: true });
    }

    /**
     * Tables that are deliberately one row per format (Career, Career Span), * Format needs to stay a visible column here so you can tell the rows
     * apart, rather than being hidden behind a filter as it is everywhere
     * else on the site.
     */
    function renderFormatColumnSubtable(container, title, rows) {
        if (!rows || !rows.length) return;
        if (title) {
            const heading = document.createElement("div");
            heading.className = "wca-subtable-title";
            heading.textContent = title;
            container.appendChild(heading);
        }
        const tableRoot = document.createElement("div");
        container.appendChild(tableRoot);
        WCA_TABLE.render(tableRoot, rows, { compact: true, showStampColumns: true, noFilters: true });
    }

    /** Top 5-style subtable: split into one table per format, format column dropped. */
    function renderSplitByFormat(container, title, rows) {
        if (!rows || !rows.length) return;
        const formats = Array.from(new Set(rows.map(r => r.Format).filter(Boolean)));
        formats.forEach(fmt => {
            const subset = WCA_TABLE.omitKey(rows.filter(r => r.Format === fmt), "Format");
            if (!subset.length) return;
            const heading = document.createElement("div");
            heading.className = "wca-subtable-title";
            heading.textContent = `${title} - ${fmt}`;
            container.appendChild(heading);
            const tableRoot = document.createElement("div");
            container.appendChild(tableRoot);
            WCA_TABLE.render(tableRoot, subset, {
                compact: true,
                linkMatchDate: true,
                matchDateLink: { index: matchLookupIndex || {} },
            });
        });
    }

    /**
     * Matches tab: unlike Top 5 Innings (a flat array with a Format column
     * to split on), data.matches already arrives pre-split by format as
     * top-level keys ({ "List A": [...], "T20": [...] }) - one row per
     * match this player appeared in, most recent first. Match_Slug is
     * carried on each row only so it can be dropped from display (the
     * Date cell links to the match via the usual matchDateLink lookup,
     * same as everywhere else - Match_Slug itself is never shown).
     */
    function renderMatchesTab(container, matchesByFormat) {
        if (!matchesByFormat || !Object.keys(matchesByFormat).length) {
            container.innerHTML = `<div class="wca-empty-state">No match-by-match data recorded for this player.</div>`;
            return;
        }
        Object.keys(matchesByFormat).forEach(fmt => {
            const rows = matchesByFormat[fmt];
            if (!rows || !rows.length) return;
            const heading = document.createElement("div");
            heading.className = "wca-subtable-title";
            heading.textContent = fmt;
            container.appendChild(heading);
            const tableRoot = document.createElement("div");
            container.appendChild(tableRoot);
            WCA_TABLE.render(tableRoot, WCA_TABLE.omitKey(rows, "Match_Slug"), {
                compact: true,
                linkMatchDate: true,
                matchDateLink: { index: matchLookupIndex || {} },
            });
        });
    }

    function renderBattingBowlingSection(containerId, sectionData) {
        const container = document.getElementById(containerId);
        if (!WCA.hasData(sectionData)) {
            container.innerHTML = `<div class="wca-empty-state">No data recorded for this section.</div>`;
            return;
        }
        renderFormatColumnSubtable(container, "Career", sectionData.career);
        renderSplitByFormat(container, "Top 5 Innings", sectionData.top5);
        WCA_TABLE.renderFormatToggleTable(container, "By Opposition", sectionData.byOpposition, { compact: true });
        WCA_TABLE.renderFormatToggleTable(container, "By Venue", sectionData.byVenue, { compact: true });
    }

    function renderMiscSection(containerId, sectionData) {
        const container = document.getElementById(containerId);
        if (!WCA.hasData(sectionData)) {
            container.innerHTML = `<div class="wca-empty-state">No data recorded for this section.</div>`;
            return;
        }
        // Career Span moved to the page summary above the tabs, only the
        // fielding/captaincy/keeping figures live here now.
        renderPlainSubtable(container, "Fielding, Captaincy & Keeping", sectionData.career);
    }

    function renderSummary(data) {
        const span = data.misc && data.misc.span;
        if (!span || !span.length) return;

        renderFormatColumnSubtable(document.getElementById("playerSummary"), null, span);

        // Team logos, next to the player's name, union of every
        // "Teams Represented" value across format rows. Real data separates
        // multiple teams with a comma ("Dragons, Lions"), occasionally also
        // "&" or "/", so all three are handled.
        const teamNames = new Set();
        span.forEach(row => {
            const raw = row["Teams Represented"];
            if (!raw) return;
            String(raw).split(/\s*[&,/]\s*/).forEach(t => t && teamNames.add(t.trim()));
        });
        if (teamNames.size) {
            const logos = document.getElementById("playerLogos");
            teamNames.forEach(team => {
                const link = document.createElement("a");
                link.href = WCA.teamUrl(team);
                link.title = team;
                const img = document.createElement("img");
                img.src = `assets/images/thumb/${encodeURIComponent(team)}.png`;
                img.alt = team;
                img.onerror = () => link.remove(); // silent fallback, no broken-image icon, no dead link either
                link.appendChild(img);
                logos.appendChild(link);
            });
        }
    }

    /**
     * Titles tab: a per-format summary ("how decorated", at a glance) on
     * top of the full season-by-season list below it. A prolific player
     * (Western Province's dynasty era especially) can rack up a dozen-plus
     * rows in the full list - see Alexis le Breton at 14 - which is too
     * much to sit in the page header next to Records Held, hence its own
     * tab rather than a badge row like the Records Held section above.
     * Team is left in as a real (linked) column in the full list,
     * deliberately not stripped the way showStampColumns normally strips
     * Season/Format, since unlike the Records tables, the player's team
     * itself changes across rows here and is part of what's being said,
     * not implied context.
     */
    function renderTitlesTab(container, titleEntries) {
        if (!titleEntries || !titleEntries.length) {
            container.innerHTML = `<div class="wca-empty-state">No Division 1 titles recorded for this player.</div>`;
            return;
        }

        const byFormat = {};
        titleEntries.forEach(t => {
            byFormat[t.format] = (byFormat[t.format] || 0) + 1;
        });
        const summaryRows = Object.keys(byFormat).sort().map(fmt => ({
            Format: fmt,
            Titles: byFormat[fmt],
        }));

        const summaryHeading = document.createElement("div");
        summaryHeading.className = "wca-subtable-title";
        summaryHeading.textContent = "By Format";
        container.appendChild(summaryHeading);
        const summaryRoot = document.createElement("div");
        container.appendChild(summaryRoot);
        WCA_TABLE.render(summaryRoot, summaryRows, { compact: true, showStampColumns: true, noFilters: true });

        const heading = document.createElement("div");
        heading.className = "wca-subtable-title";
        heading.style.marginTop = "1.25rem";
        heading.textContent = titleEntries.length === 1 ? "Division 1 Title" : `All Titles (${titleEntries.length})`;
        container.appendChild(heading);

        const rows = titleEntries.map(t => ({
            Season: t.season,
            Format: t.format,
            Team: t.team,
            Result: WCA.finishTypeLabel(t.finish_type),
        }));

        const tableRoot = document.createElement("div");
        container.appendChild(tableRoot);
        WCA_TABLE.render(tableRoot, rows, { compact: true, showStampColumns: true, noFilters: true });
    }

    /**
     * Headline records: every real (single-format) career record this
     * player holds, i.e. the same set the "Career Records (by format)"
     * table below shows, just as compact badges rather than a table.
     * Deliberately the same underlying data as that table, not a
     * separately-curated subset - two visual treatments of one set,
     * rather than two different-looking things that turn out to mean
     * different, disconnected things.
     */
    function renderHeadlineRecords(container, recordEntries) {
        if (!recordEntries || !recordEntries.length) return;
        const headline = recordEntries.filter(r => r.season === "OVERALL");
        if (!headline.length) return;

        const badges = document.createElement("div");
        badges.className = "wca-record-badges";

        const heading = document.createElement("div");
        heading.className = "wca-subtable-title";
        heading.style.marginTop = "1.25rem";
        heading.textContent = "Records Held";
        container.appendChild(heading);

        headline.forEach(r => {
            const badge = document.createElement("div");
            badge.className = "wca-record-badge";
            const shared = r.tied ? ` <span class="text-secondary">(shared, ${r.tiedCount})</span>` : "";
            badge.innerHTML = `${WCA.escapeHtml(r.label)} (${WCA.escapeHtml(r.format)}): <span class="value">${WCA.escapeHtml(r.value)}</span>${shared}`;
            badges.appendChild(badge);
        });
        container.appendChild(badges);

        const note = document.createElement("div");
        note.className = "wca-record-badges-note";
        note.textContent = "Career totals - see the Records tab below for season-by-season detail.";
        container.appendChild(note);
    }

    /** Career (per-format, season = OVERALL) and season-specific records, the Records tab. */
    function renderRecordsTab(container, recordEntries, doublesEntries) {
        const career = (recordEntries || []).filter(r => r.season === "OVERALL");
        const seasonal = (recordEntries || []).filter(r => r.season !== "OVERALL");

        // Group by record type (alphabetical), oldest season first within
        // each group, reads as a chronological history in that stat.
        seasonal.sort((a, b) => a.label.localeCompare(b.label) || a.season.localeCompare(b.season));

        function toRows(entries) {
            return entries.map(r => ({
                Season: r.season,
                Format: r.format,
                Record: r.label,
                Value: r.value,
                Held: r.tied ? `Shared (×${r.tiedCount})` : "Outright",
            }));
        }

        let renderedAny = false;

        if (career.length) {
            renderedAny = true;
            const heading = document.createElement("div");
            heading.className = "wca-subtable-title";
            heading.textContent = "Career Records (by format)";
            container.appendChild(heading);
            const root = document.createElement("div");
            container.appendChild(root);
            const rows = career.map(r => ({ Format: r.format, Record: r.label, Value: r.value, Held: r.tied ? `Shared (×${r.tiedCount})` : "Outright" }));
            WCA_TABLE.render(root, rows, { compact: true, showStampColumns: true, noFilters: true });
        }

        if (seasonal.length) {
            renderedAny = true;
            const heading = document.createElement("div");
            heading.className = "wca-subtable-title";
            heading.textContent = "Season Records";
            container.appendChild(heading);
            const root = document.createElement("div");
            container.appendChild(root);
            // A prolific player can hold 50+ individual season records
            // stacked into one flat list - splitting by Record (same
            // WCA_TABLE.renderRecordGroups already used on venue.html for
            // this exact problem) turns that into one short, independently
            // scannable table per stat, each still showing every season
            // she's held it, with a Format toggle only appearing where a
            // given stat genuinely spans both formats across her career.
            WCA_TABLE.renderRecordGroups(root, toRows(seasonal), "Record", { compact: true, showStampColumns: true, noFilters: true });
        }

        if (doublesEntries && Object.keys(doublesEntries).length) {
            renderedAny = true;
            Object.entries(doublesEntries).forEach(([label, info]) => {
                const heading = document.createElement("div");
                heading.className = "wca-subtable-title";
                heading.textContent = `${label} (${info.count})`;
                container.appendChild(heading);
                const root = document.createElement("div");
                container.appendChild(root);
                const rows = info.instances.map(i => ({
                    Date: i.date, Opposition: i.opposition, Bat: i.bat, Bowl: i.bowl, Format: i.format,
                }));
                WCA_TABLE.render(root, rows, { compact: true, showStampColumns: true, noFilters: true });
            });
        }

        if (!renderedAny) {
            container.innerHTML = `<div class="wca-empty-state">No further records to show.</div>`;
        }
    }

    async function load() {
        if (!playerName) {
            document.getElementById("playerTabContent").innerHTML =
                `<div class="wca-empty-state">No player specified. Head back to the <a href="players.html">players list</a>.</div>`;
            return;
        }

        const [data, holders, lookupIndex] = await Promise.all([
            WCA.fetchPlayer(playerName),
            WCA.fetchRecordHolders(),
            WCA.fetchMatchLookupIndex(),
        ]);
        matchLookupIndex = lookupIndex;
        if (!data) {
            document.getElementById("playerName").textContent = playerName;
            document.getElementById("playerTabContent").innerHTML =
                `<div class="wca-empty-state">Couldn't find a record for "${WCA.escapeHtml(playerName)}".</div>`;
            return;
        }

        // Format: OVERALL (combined List A + T20) is never a legitimate
        // standalone cricket record on its own - the two formats have
        // different innings lengths and scoring economies entirely, so
        // adding a player's T20 tally to her List A tally isn't a real
        // achievement in either. Filtered out here, at the source, rather
        // than in each display function separately, so nothing downstream
        // (headline badges, career table, season table) can end up
        // showing a combined-format figure as "a record held".
        const recordEntries = ((holders && holders.records && holders.records[playerName]) || []).filter(r => r.format !== "OVERALL");
        const doublesEntries = (holders && holders.doubles && holders.doubles[playerName]) || {};

        renderSummary(data);
        renderHeadlineRecords(document.getElementById("playerSummary"), recordEntries);

        // Build tabs only for sections that actually have data.
        const tabs = [];
        if (WCA.hasData(data.batting)) tabs.push({ id: "batting", label: "Batting" });
        if (WCA.hasData(data.bowling)) tabs.push({ id: "bowling", label: "Bowling" });
        if (WCA.hasData(data.misc)) tabs.push({ id: "misc", label: "Fielding & Misc" });
        if (data.matches && Object.keys(data.matches).length) tabs.push({ id: "matches", label: "Matches" });
        // Only appears for the ~230 players with at least one Division 1
        // title (see build_player_titles() in consolidate.py) - same
        // "no data, no tab" convention as every other tab here rather than
        // showing an always-empty tab for the other ~1500 players.
        const titleEntries = data.titles || [];
        if (titleEntries.length) tabs.push({ id: "titles", label: "Titles" });
        // Records tab now shows every career record (see renderRecordsTab),
        // not just the per-format breakdown, so any recordEntries at all
        // means there's something to show there - a player whose only
        // held records are the combined-format ones (already shown as
        // badges above) still gets a Records tab now, since that's their
        // one and only view of those records at all.
        const hasMoreRecords = recordEntries.length > 0 || Object.keys(doublesEntries).length;
        if (hasMoreRecords) tabs.push({ id: "records", label: "Records" });

        const tabList = document.getElementById("playerTabs");
        const tabContent = document.getElementById("playerTabContent");

        if (!tabs.length) {
            tabContent.innerHTML = `<div class="wca-empty-state">No career data recorded for this player.</div>`;
            return;
        }

        tabs.forEach((tab, i) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.innerHTML = `<button class="nav-link ${i === 0 ? "active" : ""}" data-bs-toggle="tab" data-bs-target="#pane-${tab.id}" type="button">
                ${tab.label}
            </button>`;
            tabList.appendChild(li);

            const pane = document.createElement("div");
            pane.className = `tab-pane fade ${i === 0 ? "show active" : ""}`;
            pane.id = `pane-${tab.id}`;
            pane.innerHTML = `<div id="content-${tab.id}"></div>`;
            tabContent.appendChild(pane);
        });

        if (tabs.some(t => t.id === "batting")) renderBattingBowlingSection("content-batting", data.batting);
        if (tabs.some(t => t.id === "bowling")) renderBattingBowlingSection("content-bowling", data.bowling);
        if (tabs.some(t => t.id === "misc")) renderMiscSection("content-misc", data.misc);
        if (tabs.some(t => t.id === "matches")) renderMatchesTab(document.getElementById("content-matches"), data.matches);
        if (tabs.some(t => t.id === "titles")) renderTitlesTab(document.getElementById("content-titles"), titleEntries);
        if (tabs.some(t => t.id === "records")) renderRecordsTab(document.getElementById("content-records"), recordEntries, doublesEntries);
    }

    load();
</script>
</body>
</html>
