    <style>
        .wca-entity-hero {
            background: linear-gradient(180deg, #0e2c1e 0%, var(--wca-bg) 100%);
            border-bottom: 1px solid var(--wca-border);
            padding: 2rem 0 1.5rem;
        }
        .wca-entity-hero h1 { font-weight: 700; color: #fff; font-size: clamp(1.6rem, 3.5vw, 2.3rem); margin-bottom: 0.25rem; }
        .wca-also-known-as {
            font-family: var(--wca-font-body);
            font-size: 0.85rem;
            color: var(--wca-text-dim);
            margin-bottom: 1rem;
        }
        .wca-team-hero-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            margin-top: 1rem;
        }
        .wca-team-hero-logo {
            flex-shrink: 0;
            height: 140px;
        }
        .wca-team-hero-logo img {
            height: 100%;
            width: auto;
        }
        .wca-team-hero-map {
            flex-shrink: 0;
            height: 140px;
            width: 140px;
        }
        @media (max-width: 767px) {
            .wca-team-hero-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .wca-team-hero-map { height: 120px; width: 120px; }
            .wca-team-hero-logo { height: 100px; }
        }
        .wca-tab-nav .nav-link {
            font-family: var(--wca-font-body);
            font-weight: 600;
            color: var(--wca-text-dim);
        }
        .wca-tab-nav .nav-link.active {
            background-color: var(--wca-surface);
            color: var(--wca-gold);
            border-color: var(--wca-border) var(--wca-border) var(--wca-surface);
        }
    </style>
</head>
<body>

<div id="wca-header-root"></div>

<section class="wca-entity-hero">
    <div class="container">
        <div class="wca-breadcrumb"><a href="index.html">Home</a> / <a href="teams.html">Teams</a> / <span id="crumbName">…</span></div>
        <h1 id="teamName">Loading team…</h1>
        <div id="alsoKnownAs" class="wca-also-known-as"></div>
        <div class="wca-team-hero-row">
            <div class="wca-team-hero-logo" id="teamHeroLogo"></div>
            <div class="wca-team-hero-map" id="teamHighlightMap"></div>
        </div>
    </div>
</section>

<main class="container py-4">
    <ul class="nav nav-tabs wca-tab-nav" id="teamTabs" role="tablist"></ul>
    <div class="tab-content pt-3" id="teamTabContent"></div>
</main>

<div id="wca-footer-root"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/table-render.js"></script>
<script src="assets/js/union-team-mapping.js"></script>
<script src="assets/js/union-map.js"></script>
<script>
    WCA_NAV.render("teams");
    WCA_NAV.renderFooter();

    const params = new URLSearchParams(location.search);
    const teamName = params.get("name") || "";

    document.getElementById("teamName").textContent = teamName || "Unknown team";
    document.getElementById("crumbName").textContent = teamName || "Unknown";
    document.title = `${teamName || "Team"} - Women's Provincial Cricket Database`;

    if (teamName && TEAM_NAME_TO_UNION[teamName]) {
        renderUnionHighlight("#teamHighlightMap", teamName, { geojsonUrl: "assets/geo/CricketUnions.geojson" });
    }

    if (teamName) {
        const logoImg = document.createElement("img");
        logoImg.src = `assets/images/thumb/${encodeURIComponent(teamName)}.png`;
        logoImg.alt = teamName;
        logoImg.onerror = () => logoImg.remove(); // silent fallback, no broken-image icon
        document.getElementById("teamHeroLogo").appendChild(logoImg);

        WCA.fetchTeamAliases().then(aliasMap => {
            const aliases = aliasMap[teamName];
            if (aliases && aliases.length) {
                document.getElementById("alsoKnownAs").textContent = `Also known as: ${aliases.join(", ")}`;
            }
        });
    }

    // Section order doubles as tab order, first section with data becomes
    // the default-open tab, so "most runs for a team" etc. is one click away.
    // splitKey names the column that identifies WHICH record a row belongs
    // to, for sections that interleave multiple distinct record types under
    // one flat table (e.g. "Most Runs" / "Most Wickets" / "Most Catches" all
    // sharing a "Record" or "Type" column), those get split into one table
    // per record type instead of one jumbled combined table.
    const SECTIONS = [
        { key: "summary", label: "Summary", compact2col: true },
        { key: "results", label: "Results" },
        { key: "records", label: "Records", splitKey: "Record" },
        { key: "averages", label: "Averages", splitKey: "Record", compact2col: true },
        { key: "headToHead", label: "Head-to-Head", formatToggle: true },
        { key: "squads", label: "Squads" },
        { key: "playerRecords", label: "Player Records", splitKey: "Record" },
        { key: "careerRecords", label: "Career Records", splitKey: "Type" },
    ];

    /**
     * squadsBySeason is { "05/06": [Known_Name, ...], ... } - a plain
     * season-keyed roster, not a row array like every other section here,
     * so it gets its own small season-select control (same plain <select>
     * convention as seasons.html) rather than going through WCA_TABLE at
     * all. Defaults to the most recent season, not OVERALL like every
     * other filter on the site - a whole-career "OVERALL squad" would
     * just be every player who ever played for the team, which isn't a
     * meaningful roster view.
     */
    function renderSquadsPane(pane, squadsBySeason) {
        const seasons = Object.keys(squadsBySeason).sort((a, b) => a.localeCompare(b));
        const mostRecent = seasons[seasons.length - 1];

        const controls = document.createElement("div");
        controls.className = "wca-filter-row mb-3";
        controls.innerHTML = `
            <label class="form-label fw-bold" for="squadSeasonSelect">Season</label>
            <select id="squadSeasonSelect" aria-label="Season">
                ${seasons.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>`;
        pane.appendChild(controls);

        const list = document.createElement("div");
        list.className = "wca-squad-list";
        pane.appendChild(list);

        function renderSeason(season) {
            const names = squadsBySeason[season] || [];
            list.innerHTML = names.length
                ? `<ul class="wca-squad-grid">${names.map(n => `<li>${WCA.entityLink(n, "player")}</li>`).join("")}</ul>`
                : `<div class="wca-empty-state">No squad recorded for this season.</div>`;
        }

        const select = controls.querySelector("#squadSeasonSelect");
        select.value = mostRecent;
        select.addEventListener("change", () => renderSeason(select.value));
        renderSeason(mostRecent);
    }

    async function load() {
        const tabList = document.getElementById("teamTabs");
        const tabContent = document.getElementById("teamTabContent");

        if (!teamName) {
            tabContent.innerHTML = `<div class="wca-empty-state">No team specified. Head back to the <a href="teams.html">teams list</a>.</div>`;
            return;
        }

        const data = await WCA.fetchTeam(teamName);
        if (!data) {
            tabContent.innerHTML = `<div class="wca-empty-state">Couldn't find a record for "${WCA.escapeHtml(teamName)}".</div>`;
            return;
        }

        // Results comes from the standings dataset (one row per team per
        // season/format), not from the team's own JSON file, fetch and
        // filter it once up front so the section-active check below and
        // the render loop can both use it without re-fetching.
        const allStandings = await WCA.fetchStandings() || [];
        const teamResults = allStandings
            .filter(r => r.Team === teamName)
            .sort((a, b) => a.Season.localeCompare(b.Season))
            .map(r => ({
                Season: r.Season,
                Division: r.Division,
                Position: r.Position,
                Result: WCA.finishTypeLabel(r.Finish_Type),
                Pts: r.Points,
                NRR: r.Net_Run_Rate,
                Format: r.Format, // consumed by renderFormatToggleTable's own grouping, stripped before display
            }));

        const activeSections = SECTIONS.filter(sec =>
            sec.key === "results" ? (teamResults.length || (data.bestFinish && data.bestFinish.length))
            : sec.key === "squads" ? (data.squads && Object.keys(data.squads).length)
            : (data[sec.key] && data[sec.key].length)
        );

        if (!activeSections.length) {
            tabContent.innerHTML = `<div class="wca-empty-state">No records found for this team yet.</div>`;
            return;
        }

        activeSections.forEach((sec, i) => {
            const li = document.createElement("li");
            li.className = "nav-item";
            li.innerHTML = `<button class="nav-link ${i === 0 ? "active" : ""}" data-bs-toggle="tab" data-bs-target="#pane-${sec.key}" type="button">
                ${sec.label}
            </button>`;
            tabList.appendChild(li);

            const pane = document.createElement("div");
            pane.className = `tab-pane fade ${i === 0 ? "show active" : ""}`;
            pane.id = `pane-${sec.key}`;
            tabContent.appendChild(pane);

            if (sec.key === "results") {
                // Best Finishes (from the team's own JSON) stays as-is,
                // followed by the full season-by-season breakdown from the
                // standings dataset, not a replacement, an addition.
                if (data.bestFinish && data.bestFinish.length) {
                    const bfHeading = document.createElement("div");
                    bfHeading.className = "wca-subtable-title";
                    bfHeading.textContent = "Best Finishes";
                    pane.appendChild(bfHeading);

                    const bfRoot = document.createElement("div");
                    pane.appendChild(bfRoot);
                    WCA_TABLE.render(bfRoot, data.bestFinish, { compact: true, showStampColumns: true, noFilters: true });
                }

                if (teamResults.length) {
                    // Season needs to stay a visible column (this table
                    // spans many seasons), so showStampColumns+noFilters
                    // keeps it shown rather than turned into a filter
                    // dropdown, same reasoning the table above uses.
                    WCA_TABLE.renderFormatToggleTable(pane, "Season by Season", teamResults, { compact: true, showStampColumns: true, noFilters: true });
                }
            } else if (sec.key === "squads") {
                renderSquadsPane(pane, data.squads);
            } else if (sec.formatToggle) {
                // One row-type (one row per opponent), just needs the
                // Format toggle - no renderRecordGroups splitKey involved.
                WCA_TABLE.renderFormatToggleTable(pane, null, data[sec.key], { compact: true, noFilters: true, defaultSort: { col: "Total_Matches", dir: "desc" } });
            } else if (sec.splitKey) {
                // Multiple distinct record types interleaved under one
                // column (e.g. "Most Runs"/"Most Wickets"/"Most Catches")
                // split into one table per type, each defaulting to List A.
                WCA_TABLE.renderRecordGroups(pane, data[sec.key], sec.splitKey, { compact: true, compact2col: sec.compact2col });
            } else {
                const tableRoot = document.createElement("div");
                pane.appendChild(tableRoot);
                WCA_TABLE.render(tableRoot, data[sec.key], { compact: true, compact2col: sec.compact2col });
            }
        });
    }

    load();
</script>
</body>
</html>
