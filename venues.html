<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venues - Women's Provincial Cricket Database</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <link rel="canonical" href="https://womenscricketdb.github.io/venues.html">
    <meta name="description" content="Ground-by-ground scoring history for every venue in South African women's domestic cricket.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Women's Provincial Cricket Database">
    <meta property="og:title" content="Venues - Women's Provincial Cricket Database">
    <meta property="og:description" content="Ground-by-ground scoring history for every venue in South African women's domestic cricket.">
    <meta property="og:url" content="https://womenscricketdb.github.io/venues.html">
    <meta property="og:image" content="https://womenscricketdb.github.io/assets/images/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Venues - Women's Provincial Cricket Database">
    <meta name="twitter:description" content="Ground-by-ground scoring history for every venue in South African women's domestic cricket.">
    <meta name="twitter:image" content="https://womenscricketdb.github.io/assets/images/share-card.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">

    <style>
        .wca-venue-map-card {
            background: var(--wca-surface);
            border: 1px solid var(--wca-border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        .wca-venue-map-card .hint {
            font-family: var(--wca-font-body);
            font-size: 0.8rem;
            color: var(--wca-text-dim);
            margin-top: 0.5rem;
        }
        #venueMap {
            max-width: min(100%, 65vh);
            margin: 0 auto;
        }
        .wca-venue-list-item {
            display: block;
            padding: 0.6rem 0.9rem;
            border-radius: 6px;
            color: var(--wca-text);
            text-decoration: none;
            font-family: var(--wca-font-body);
        }
        .wca-venue-list-item:hover { background: var(--wca-surface-raised); color: #fff; text-decoration:none; }
        .wca-venue-list-item .city { color: var(--wca-text-dim); font-size: 0.8rem; }
        .wca-venue-team-logo {
            height: 18px;
            width: 18px;
            object-fit: contain;
            vertical-align: -3px;
            margin-right: 0.4rem;
        }
    </style>
</head>
<body>

<div id="wca-header-root"></div>

<main class="container py-4">
    <div class="wca-breadcrumb"><a href="index.html">Home</a> / Venues</div>
    <h1 class="wca-section-title">Venues</h1>

    <div class="wca-venue-map-card">
        <div id="venueMap"></div>
        <div class="hint">Hover a marker for the city and its grounds (on touch, tap once to see it, tap again to open), or pick from the list if a city/town has more than one. White markers are a team's home ground.</div>
    </div>

    <div class="wca-format-toggle" id="homeGroundToggle">
        <button type="button" class="active" data-mode="all">All Venues</button>
        <button type="button" data-mode="home">Home Grounds Only</button>
    </div>

    <div class="wca-format-toggle" id="clusterToggle" style="margin-top:0.5rem;">
        <button type="button" data-cluster="on">Group Nearby</button>
        <button type="button" data-cluster="off">Individual</button>
    </div>

    <div class="wca-alpha-strip" id="alphaStrip"></div>
    <div id="venueList">
        <div class="wca-loading"><div class="wca-spinner"></div> Loading venues…</div>
    </div>
</main>

<div id="wca-footer-root"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/venue-map.js"></script>
<script>
    WCA_NAV.render("venues");
    WCA_NAV.renderFooter();

    async function load() {
        const [names, coords, homeGrounds] = await Promise.all([
            WCA.fetchNameIndex("venues"),
            WCA.fetchVenueCoords(),
            WCA.fetchHomeGrounds(),
        ]);

        if (!names.length) {
            document.getElementById("venueList").innerHTML = `<div class="wca-empty-state">No venues found.</div>`;
            return;
        }

        const sorted = [...names].sort((a, b) => a.localeCompare(b));

        const allPoints = sorted.map(name => ({
            name,
            lat: coords[name] ? coords[name].lat : NaN,
            lng: coords[name] ? coords[name].lng : NaN,
            city: coords[name] ? coords[name].city : "",
            homeTeams: homeGrounds[name] || [],
        }));

        // Default: on for narrow/mobile viewports (matches the site's
        // existing 767px breakpoint), off for desktop - but the toggle lets
        // anyone override either way, and that explicit choice is
        // remembered (this is a real site page, not a sandboxed artifact,
        // so localStorage is fine here).
        const CLUSTER_STORAGE_KEY = "wca-venue-map-clustered";
        const storedCluster = localStorage.getItem(CLUSTER_STORAGE_KEY);
        let clustered = storedCluster !== null ? storedCluster === "true" : window.matchMedia("(max-width: 767px)").matches;

        function updateClusterButtons() {
            document.querySelectorAll("#clusterToggle button").forEach(b => {
                b.classList.toggle("active", (b.dataset.cluster === "on") === clustered);
            });
        }
        updateClusterButtons();

        function renderAll(mode) {
            const points = mode === "home" ? allPoints.filter(p => p.homeTeams.length) : allPoints;

            renderVenueMap("#venueMap", points, { linkFn: (name) => WCA.venueUrl(name), clustered });

            // --- alphabetical list, grouped ---
            const groups = {};
            points.forEach(p => {
                const letter = p.name[0].toUpperCase();
                (groups[letter] = groups[letter] || []).push(p);
            });
            const letters = Object.keys(groups).sort();

            document.getElementById("alphaStrip").innerHTML = letters.map(l => `<a href="#letter-${l}">${l}</a>`).join("");

            const listRoot = document.getElementById("venueList");
            if (!letters.length) {
                listRoot.innerHTML = `<div class="wca-empty-state">No home ground data found.</div>`;
                return;
            }
            listRoot.innerHTML = letters.map(letter => `
                <h2 class="wca-subtable-title" id="letter-${letter}" style="margin-top:1.5rem;">${letter}</h2>
                <div class="row g-2">
                    ${groups[letter].map(p => {
                        const homeTeam = p.homeTeams[0];
                        const logo = homeTeam
                            ? `<img class="wca-venue-team-logo" src="assets/images/thumb/${encodeURIComponent(homeTeam)}.png" alt="" onerror="this.remove()">`
                            : "";
                        return `<div class="col-6 col-md-4 col-lg-3">
                            <a class="wca-venue-list-item" href="${WCA.venueUrl(p.name)}">
                                ${logo}${WCA.escapeHtml(p.name)}
                                ${p.city ? `<div class="city">${WCA.escapeHtml(p.city)}</div>` : ""}
                            </a>
                        </div>`;
                    }).join("")}
                </div>
            `).join("");
        }

        renderAll("all");

        document.querySelectorAll("#homeGroundToggle button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#homeGroundToggle button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderAll(btn.dataset.mode);
            });
        });

        document.querySelectorAll("#clusterToggle button").forEach(btn => {
            btn.addEventListener("click", () => {
                clustered = btn.dataset.cluster === "on";
                localStorage.setItem(CLUSTER_STORAGE_KEY, String(clustered));
                updateClusterButtons();
                const currentMode = document.querySelector("#homeGroundToggle button.active").dataset.mode;
                renderAll(currentMode);
            });
        });
    }

    load();
</script>
</body>
</html>
